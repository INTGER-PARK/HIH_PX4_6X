module_name: palletrone_control
parameters:
- group: Palletrone Control
  definitions:
    ZZZ_PAL_CFG_VER:
      description:
        short: Palletrone mini-airframe configuration migration version
        long: Internal one-time marker for targeted gain and AUX DShot migration without resetting calibration.
      type: int32
      default: 0
      min: 0
      max: 2147483647
    MC_ROLL_D:
      description:
        short: Palletrone roll attitude D gain
        long: Defaulted to zero for the 4 kg mini airframe; retune after stable hover.
      type: float
      default: 0.0
    MC_PITCH_D:
      description:
        short: Palletrone pitch attitude D gain
        long: Defaulted to zero for the 4 kg mini airframe; retune after stable hover.
      type: float
      default: 0.0
    MC_YAW_D:
      description:
        short: Palletrone yaw attitude D gain
        long: Defaulted to zero for the 4 kg mini airframe; retune after stable hover.
      type: float
      default: 0.0
    MC_YAWTRIM:
      description:
        short: Palletrone yaw trimming limit
      type: float
      default: 1.0
    MPC_USE_HTE:
      description:
        short: Use hover thrust estimator
      type: boolean
      default: true
    MPC_XY_ACC_MAX:
      description:
        short: Palletrone maximum horizontal acceleration
      type: float
      default: 10.0
    MPC_Z_ACC_MAX_UP:
      description:
        short: Palletrone maximum upward acceleration
      type: float
      default: 80.0
    MPC_XY_D:
      description:
        short: Palletrone horizontal position D gain
      type: float
      default: 0.0
    MPC_Z_D:
      description:
        short: Palletrone vertical position D gain
      type: float
      default: 0.0
